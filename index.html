<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças Forja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ebee;--panel:#ffffff;--panel2:#f3f4f6;--ink:#14161a;--mute:#5b626c;--line:#d3d8de;
  --acc:#ff6a00;--acc2:#ffa040;--pos:#0f8f58;--neg:#d4352d;--warn:#c98200;--shadow:rgba(20,22,26,.18);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#070707;--panel:#141414;--panel2:#1c1c1c;--ink:#f1f1f1;--mute:#a0a0a0;--line:#2d2d2d;
  --acc:#ff7a12;--acc2:#ffb066;--pos:#2fd18b;--neg:#ff5a4f;--warn:#ffb02e;--shadow:rgba(0,0,0,.7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070707;--panel:#141414;--panel2:#1c1c1c;--ink:#f1f1f1;--mute:#a0a0a0;--line:#2d2d2d;
    --acc:#ff7a12;--acc2:#ffb066;--pos:#2fd18b;--neg:#ff5a4f;--warn:#ffb02e;--shadow:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.num{font-family:'Chakra Petch','Barlow',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(180deg,#ffc58a,#ff8a1f 30%,#e85d00 55%,#7a2a00);border:1px solid #5a1f00;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #5a1f00,0 6px 10px var(--shadow);display:grid;place-items:center;color:#1a0a00;font:700 20px 'Chakra Petch',sans-serif}
h1{font-size:22px;margin:0;letter-spacing:.2px}
.sub{font-size:13px;color:var(--mute)}
nav.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
button{font:inherit;cursor:pointer}
.btn{position:relative;border:1px solid #6e2600;border-radius:10px;padding:9px 16px;font:600 15px 'Chakra Petch','Barlow',sans-serif;color:#1c0b00;white-space:nowrap;
  background:linear-gradient(180deg,#ffd0a0 0%,#ff9230 16%,#ec6200 48%,#b94100 52%,#ff7f1a 100%);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 3px rgba(0,0,0,.35),0 4px 0 #6e2600,0 8px 10px var(--shadow);
  transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 2px rgba(0,0,0,.4),0 1px 0 #6e2600,0 2px 4px var(--shadow)}
.btn.steel{border-color:#3a3d41;color:#101214;background:linear-gradient(180deg,#fafafa 0%,#cfd2d6 18%,#92979c 48%,#72777c 52%,#bcc0c4 100%);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 3px rgba(0,0,0,.3),0 4px 0 #3a3d41,0 8px 10px var(--shadow)}
.btn.steel:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 0 #3a3d41,0 2px 4px var(--shadow)}
.btn.chrome{border-color:#000;color:#f3f3f3;text-shadow:0 -1px 0 rgba(0,0,0,.8);background:linear-gradient(180deg,#6a6a6a 0%,#363636 18%,#121212 50%,#050505 52%,#2e2e2e 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.6),0 4px 0 #000,0 8px 10px var(--shadow)}
.btn.chrome:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 #000,0 2px 4px var(--shadow)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 2px rgba(0,0,0,.3),0 3px 0 #6e2600,0 5px 7px var(--shadow)}
.btn.steel.sm{box-shadow:inset 0 1px 0 #fff,inset 0 -1px 2px rgba(0,0,0,.3),0 3px 0 #3a3d41,0 5px 7px var(--shadow)}
.btn.chrome.sm{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #000,0 5px 7px var(--shadow)}
.btn.round{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:20px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.tabs .btn{flex:0 0 auto}
.tabs .btn.chrome[aria-selected="false"]{opacity:.92}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:860px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:620px){.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 18px var(--shadow);min-width:0}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:0 0 6px}
.kpi .lbl{font-size:13px;color:var(--mute)}
.kpi .val{font:700 26px 'Chakra Petch',sans-serif;margin-top:2px;overflow-wrap:anywhere}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.acc{color:var(--acc)}
.mute{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
.field label{font-size:12px;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0;box-shadow:inset 0 2px 3px rgba(0,0,0,.18)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--mute)}
.bar{height:14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(180deg,#ffc58a,#ff8a1f 40%,#d95500);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.bar>i.w{background:linear-gradient(180deg,#ffe29a,#ffb02e 40%,#c98200)}
.bar>i.o{background:linear-gradient(180deg,#ff9a90,#ff5a4f 40%,#b3231b)}
.gauge{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,var(--pos) 0 50%,var(--warn) 50% 80%,var(--neg) 80% 100%);border:1px solid var(--line);margin:10px 0 6px;opacity:.9}
.gauge b{position:absolute;top:-6px;width:8px;height:28px;border-radius:4px;background:var(--ink);border:2px solid var(--panel);transform:translateX(-50%);box-shadow:0 2px 6px var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.empty{padding:18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:11px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{padding:10px 13px;border-radius:12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:linear-gradient(180deg,#ff9a3c,#e65e00);color:#190a00;border:1px solid #6e2600}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.scroll-x{overflow-x:auto}
.calc-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;font-size:24px}
.calc{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:45;width:min(300px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 14px 40px var(--shadow)}
.calc[hidden]{display:none}
.calc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 15px 'Chakra Petch',sans-serif;cursor:grab;touch-action:none;user-select:none;padding-bottom:10px}
.calc-disp{background:#0b0b0b;border:1px solid #000;border-radius:10px;padding:8px 12px;text-align:right;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);color:#ffb066;min-height:68px}
.calc-expr{font-size:13px;color:#b9855a;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-cur{font-size:30px;font-weight:700;overflow-x:auto;white-space:nowrap;line-height:1.2}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.ck{width:100%;padding:11px 0;font-size:19px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg text{fill:var(--mute);font:11px 'Barlow',sans-serif}
.cur{display:flex;flex-direction:column;gap:2px}
.cur .code{font:600 13px 'Chakra Petch',sans-serif;color:var(--acc)}
.cur .big{font:700 20px 'Chakra Petch',sans-serif;overflow-wrap:anywhere}
.cur .rt{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">$</div>
      <div><h1>Finanças Forja</h1><div class="sub" id="saveState">Seus dados ficam salvos neste app</div></div>
    </div>
    <button class="btn steel round" id="themeBtn" aria-label="Alternar modo escuro e claro" title="Modo escuro / claro">☾</button>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<button class="btn round calc-fab" id="calcFab" aria-label="Abrir calculadora" aria-expanded="false" title="Calculadora">🧮</button>
<div id="calc" class="calc" role="dialog" aria-label="Calculadora" hidden>
  <div class="calc-head" id="calcHead"><span>Calculadora</span><button class="btn chrome sm" id="calcClose" aria-label="Fechar calculadora">✕</button></div>
  <div class="calc-disp"><div id="calcExpr" class="calc-expr">&nbsp;</div><div id="calcCur" class="calc-cur num">0</div></div>
  <div class="calc-keys" id="calcKeys"></div>
  <button class="btn sm" id="calcUse" style="width:100%;margin-top:12px">Usar no campo</button>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
var CATS=["Moradia","Alimentação","Transporte","Lazer","Saúde","Educação","Compras","Outros"];
var INCOME_CATS=["Salário","Extra","Investimentos","Outros"];
var PALETTE=["#ff6a00","#ffa040","#ffd08a","#b33f00","#8d9298","#c8ccd0","#5c3a22","#e9e9e9"];
var CURS=[["USD","Dólar americano"],["EUR","Euro"],["CLP","Peso chileno"],["CAD","Dólar canadense"],["AUD","Dólar australiano"]];
var TABS=[["painel","Painel"],["lanc","Lançamentos"],["dividas","Dívidas fixas"],["cofre","Cofrinho e moedas"],["orc","Orçamento"],["rec","Recorrentes"],["metas","Metas"],["ia","IA financeira"]];
var TYPES={viagem:"✈️ Viagem",casa:"🏠 Casa",outro:"🎯 Outra meta"};

function def(){return{tx:[],debts:[],pots:[],goals:[],meta:0,budgets:{},recur:[],reserveMonths:6,reservePot:"",
  rates:{USD:5.18,EUR:5.93,CLP:0.0056,CAD:3.67,AUD:3.60,date:"2026-10-13",approx:true},
  theme:"dark",updatedAt:0};}
var S=def(), tab="painel", cur=ym(new Date()), editRates=false;
var editing=null, chat=[], sampleFn=null, busy=false, dbDoc=null, saveTimer=null;

function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function addM(m,n){var p=m.split("-");var d=new Date(+p[0],+p[1]-1+n,1);return ym(d);}
function monthName(m){var p=m.split("-");var s=new Date(+p[0],+p[1]-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function money(v,c){try{return v.toLocaleString("pt-BR",{style:"currency",currency:c,maximumFractionDigits:c==="CLP"?0:2});}catch(e){return v.toFixed(2)+" "+c;}}
function num(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;}
function $(s){return document.querySelector(s);}

/* ---------- persistência ---------- */
function setSaveText(t){var e=$("#saveState");if(e)e.textContent=t;}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem("financas-forja",JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!dbDoc){setSaveText("Salvo neste aparelho");return;}
    dbDoc.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).then(function(){setSaveText("Salvo na sua conta");}).catch(function(){setSaveText("Salvo neste aparelho");});
  },900);
}
function load(){
  try{var raw=localStorage.getItem("financas-forja");if(raw){var o=JSON.parse(raw);S=Object.assign(def(),o);}}catch(e){}
}
async function connectDb(){
  try{
    if(!window.claude||!claude.use)return;
    var user=await claude.use("user"); var db=await claude.use("db");
    if(!user||!db)return;
    var id=await user.id(); if(!id)return;
    dbDoc=db.collection("data/users/"+id).doc("state");
    var snap=await dbDoc.get();
    if(snap.exists){
      var d=snap.data();
      if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){
        try{S=Object.assign(def(),JSON.parse(d.json));if(applyRecurring())save();applyTheme();render();}catch(e){}
      }
    }
    setSaveText("Salvo na sua conta");
  }catch(e){dbDoc=null;}
}
async function connectSample(){
  try{if(window.claude&&claude.use){sampleFn=await claude.use("sample");if(tab==="ia")render();}}catch(e){sampleFn=null;}
}

/* ---------- cálculos ---------- */
function debtActive(d,m){
  if(m<d.start)return false;
  if(d.n&&d.n>0&&m>addM(d.start,d.n-1))return false;
  return true;
}
function stats(m){
  var inc=0,exp=0,cats={};
  S.tx.forEach(function(t){
    if(t.d.slice(0,7)!==m)return;
    if(t.type==="in")inc+=t.v;else{exp+=t.v;cats[t.cat]=(cats[t.cat]||0)+t.v;}
  });
  var fixed=0,fixedPaid=0,fixedCount=0;
  S.debts.forEach(function(d){
    if(debtActive(d,m)){fixed+=d.v;fixedCount++;if(d.paid&&d.paid[m])fixedPaid+=d.v;}
  });
  if(fixed>0)cats["Dívidas fixas"]=fixed;
  var spend=exp+fixed;
  var ratio=inc>0?spend/inc:(spend>0?9:0);
  return{inc:inc,exp:exp,fixed:fixed,fixedPaid:fixedPaid,fixedCount:fixedCount,spend:spend,saldo:inc-spend,ratio:ratio,cats:cats};
}
function level(st){
  if(st.inc===0&&st.spend>0)return{t:"Sem entradas no mês",c:"neg"};
  if(st.spend===0)return{t:"Sem gastos ainda",c:"mute"};
  if(st.ratio<=.5)return{t:"Tranquilo",c:"pos"};
  if(st.ratio<=.8)return{t:"Atenção",c:"warn"};
  return{t:"Crítico",c:"neg"};
}
function potBal(p){return p.hist.reduce(function(a,h){return a+h.v;},0);}
function totalSaved(){return S.pots.reduce(function(a,p){return a+potBal(p);},0);}
function brlPer(c){return S.rates[c]||1;}

/* ---------- gráficos ---------- */
function barChart(list){
  var W=620,H=230,pl=44,pb=28,pt=12,max=1;
  list.forEach(function(x){max=Math.max(max,x.inc,x.spend);});
  var bw=(W-pl-10)/list.length, ph=H-pb-pt, out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Entradas e gastos dos últimos 6 meses">';
  for(var g=0;g<=4;g++){
    var y=pt+ph-(ph*g/4);
    out+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    out+='<text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(max*g/4)+'</text>';
  }
  list.forEach(function(x,i){
    var cx=pl+i*bw+bw/2, w=Math.min(26,bw/3);
    var h1=ph*x.inc/max, h2=ph*x.spend/max;
    out+='<rect x="'+(cx-w-2)+'" y="'+(pt+ph-h1)+'" width="'+w+'" height="'+h1+'" rx="4" fill="var(--pos)"/>';
    out+='<rect x="'+(cx+2)+'" y="'+(pt+ph-h2)+'" width="'+w+'" height="'+h2+'" rx="4" fill="var(--acc)"/>';
    out+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(x.label)+'</text>';
  });
  return out+'</svg><div class="legend"><span style="--c:var(--pos)">Entradas</span><span style="--c:var(--acc)">Gastos (com dívidas fixas)</span></div>';
}
function short(v){if(v>=1000)return (Math.round(v/100)/10)+"k";return String(Math.round(v));}
function donut(cats){
  var keys=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
  var total=keys.reduce(function(a,k){return a+cats[k];},0);
  if(!total)return '<div class="empty">Sem gastos neste mês para mostrar.</div>';
  var r=60,C=2*Math.PI*r,off=0,out='<div class="row" style="align-items:center"><svg viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="Gastos por categoria"><g transform="rotate(-90 80 80)">';
  keys.forEach(function(k,i){
    var len=C*cats[k]/total;
    out+='<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="'+PALETTE[i%PALETTE.length]+'" stroke-width="26" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=len;
  });
  out+='</g></svg><div class="legend" style="flex-direction:column;margin:0">';
  keys.forEach(function(k,i){out+='<span style="--c:'+PALETTE[i%PALETTE.length]+'">'+esc(k)+': <b>'+brl(cats[k])+'</b> ('+Math.round(cats[k]/total*100)+'%)</span>';});
  return out+'</div></div>';
}
function lineChart(pts){
  var W=620,H=200,pl=44,pb=26,pt=12,ph=H-pb-pt,max=1;
  pts.forEach(function(p){max=Math.max(max,p.v);});
  var step=(W-pl-14)/Math.max(1,pts.length-1),path="",dots="",lbl="";
  pts.forEach(function(p,i){
    var x=pl+i*step,y=pt+ph-ph*p.v/max;
    path+=(i?"L":"M")+x+" "+y+" ";
    dots+='<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="var(--acc)" stroke="var(--panel)" stroke-width="2"/>';
    lbl+='<text x="'+x+'" y="'+(H-7)+'" text-anchor="middle">'+esc(p.label)+'</text>';
  });
  var grid="";
  for(var g=0;g<=3;g++){var y=pt+ph-ph*g/3;grid+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(max*g/3)+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolução do valor guardado">'+grid+'<path d="'+path+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>'+dots+lbl+'</svg>';
}

/* ---------- telas ---------- */
function monthNav(){
  return '<div class="row between" style="margin-bottom:12px"><button class="btn chrome sm" data-act="prev" aria-label="Mês anterior">◀</button><h2 style="margin:0">'+esc(monthName(cur))+'</h2><button class="btn chrome sm" data-act="next" aria-label="Próximo mês">▶</button></div>';
}
function vPainel(){
  var st=stats(cur), lv=level(st), pos=Math.min(100,st.ratio*100);
  var list=[];
  for(var i=5;i>=0;i--){var m=addM(cur,-i),s=stats(m);list.push({label:monthName(m).slice(0,3),inc:s.inc,spend:s.spend});}
  var saved=totalSaved();
  var h=monthNav();
  h+='<div class="grid g4">'+
   kpi("Entradas (positivo)",brl(st.inc),"pos")+
   kpi("Saídas variáveis (negativo)",brl(st.exp),"neg")+
   kpi("Dívidas fixas do mês",brl(st.fixed),"warn")+
   kpi("Saldo do mês",brl(st.saldo),st.saldo>=0?"pos":"neg")+'</div>';
  h+='<div class="grid g2" style="margin-top:14px">';
  h+='<div class="card"><h2>Nível de gastos</h2><div class="row between"><div class="num" style="font-size:28px;font-weight:700">'+(st.inc>0?Math.round(st.ratio*100)+"%":"—")+'</div><div class="num '+lv.c+'" style="font-size:20px;font-weight:700">'+lv.t+'</div></div>'+
     '<div class="gauge" aria-hidden="true"><b style="left:'+pos+'%"></b></div>'+
     '<div class="row between sub"><span>0%</span><span>até 50% tranquilo</span><span>80%+ crítico</span></div>'+
     '<p class="sub" style="margin:10px 0 0">Mostra quanto das suas entradas já foi para gastos e dívidas fixas.</p></div>';
  h+='<div class="card"><h2>Resumo geral</h2>'+
     '<div class="item"><span>Guardado no total</span><b class="num acc">'+brl(saved)+'</b></div><div class="list">'+
     '<div class="item"><span>Dívidas fixas pagas</span><b>'+brl(st.fixedPaid)+' de '+brl(st.fixed)+'</b></div>'+
     '<div class="item"><span>Metas ativas</span><b>'+S.goals.length+'</b></div></div></div>';
  h+='</div>';
  h+=dueAlerts()+vProj(st)+budgetAlerts(st);
  h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Desempenho dos últimos 6 meses</h2><div class="scroll-x">'+barChart(list)+'</div></div>';
  h+='<div class="card"><h2>Para onde o dinheiro foi</h2>'+donut(st.cats)+'</div></div>';
  return h;
}
function isEd(k,id){return editing&&editing.k===k&&editing.id===id;}
function opts(list,sel){return list.map(function(c){return '<option'+(c===sel?' selected':'')+'>'+c+'</option>';}).join("");}
function fv(v){return String(v).replace(".",",");}
function editBtns(){return '<button class="btn sm" type="submit" style="align-self:flex-end">Salvar</button><button class="btn steel sm" type="button" data-act="canceledit" style="align-self:flex-end">Cancelar</button>';}
function editTx(t){
  return '<div class="item" style="flex-direction:column;align-items:stretch"><form data-form="txedit" data-id="'+t.id+'"><div class="row">'+
    '<div class="field"><label for="etp">Tipo</label><select id="etp" name="type"><option value="in"'+(t.type==="in"?' selected':'')+'>Entrada (+)</option><option value="out"'+(t.type==="out"?' selected':'')+'>Saída (−)</option></select></div>'+
    '<div class="field" style="flex:2 1 160px"><label for="etd">Descrição</label><input id="etd" name="desc" value="'+esc(t.desc)+'" required></div>'+
    '<div class="field"><label for="etv">Valor (R$)</label><input id="etv" name="v" inputmode="decimal" value="'+fv(t.v)+'" required></div>'+
    '<div class="field"><label for="etc">Categoria</label><select id="etc" name="cat">'+opts(CATS.concat(["—"]),t.cat)+'</select></div>'+
    '<div class="field"><label for="etdt">Data</label><input id="etdt" name="d" type="date" value="'+esc(t.d)+'" required></div>'+
    editBtns()+'</div></form></div>';
}

    '<div class="field"><label for="edv">Valor mensal (R$)</label><input id="edv" name="v" inputmode="decimal" value="'+fv(d.v)+'" required></div>'+
    '<div class="field"><label for="edd">Vence no dia</label><input id="edd" name="day" type="number" min="1" max="31" value="'+d.day+'"></div>'+
    '<div class="field"><label for="eds">Começa em</label><input id="eds" name="start" type="month" value="'+esc(d.start)+'" required></div>'+
    '<div class="field"><label for="edp">Parcelas</label><input id="edp" name="n" type="number" min="0" value="'+(d.n||"")+'" placeholder="Sem fim"></div>'+

}
function editGoal(g){
  return '<div class="card"><h3>Editar meta</h3><form data-form="goaledit" data-id="'+g.id+'"><div class="row">'+
    '<div class="field"><label for="egt">Tipo</label><select id="egt" name="type"><option value="viagem"'+(g.type==="viagem"?' selected':'')+'>Viagem</option><option value="casa"'+(g.type==="casa"?' selected':'')+'>Casa</option><option value="outro"'+(g.type==="outro"?' selected':'')+'>Outra meta</option></select></div>'+
    '<div class="field" style="flex:2 1 160px"><label for="egn">Nome</label><input id="egn" name="name" value="'+esc(g.name)+'" required></div>'+
    '<div class="field"><label for="egv">Valor da meta (R$)</label><input id="egv" name="target" inputmode="decimal" value="'+fv(g.target)+'" required></div>'+
    '<div class="field"><label for="egs">Já guardado (R$)</label><input id="egs" name="saved" inputmode="decimal" value="'+fv(g.saved)+'"></div>'+
    '<div class="field"><label for="egd">Prazo</label><input id="egd" name="dl" type="date" value="'+esc(g.dl||"")+'"></div>'+

function dueAlerts(){
  var now=new Date(),nowM=ym(now),nm=addM(nowM,1),d0=now.getDate(),p=nowM.split("-"),q=nm.split("-");
  var dim=new Date(+p[0],+p[1],0).getDate(),dimN=new Date(+q[0],+q[1],0).getDate(),list=[];
  S.debts.forEach(function(d){
    if(debtActive(d,nowM)&&!(d.paid&&d.paid[nowM])){
      var dd=Math.min(d.day,dim),diff=dd-d0;
      if(diff<=5)list.push({d:d,m:nowM,dd:dd,diff:diff});
    }
    if(debtActive(d,nm)&&!(d.paid&&d.paid[nm])){
      var dd2=Math.min(d.day,dimN),diff2=dim-d0+dd2;
      if(diff2<=5)list.push({d:d,m:nm,dd:dd2,diff:diff2});
    }
  });
  if(!list.length)return "";
  list.sort(function(a,b){return a.diff-b.diff;});
  return '<div class="card" style="margin-top:14px"><h2>Vencimentos próximos</h2><div class="list">'+list.map(function(x){
    var txt=x.diff<0?'Venceu há '+(-x.diff)+(x.diff===-1?' dia':' dias'):(x.diff===0?'Vence hoje':'Vence em '+x.diff+(x.diff===1?' dia':' dias'));
    return '<div class="item"><div><div class="t">'+esc(x.d.name)+'</div><div class="s">Dia '+x.dd+'/'+x.m.slice(5)+'</div></div><div class="row"><b class="num '+(x.diff<0?'neg':'warn')+'">'+txt+' · '+brl(x.d.v)+'</b><button class="btn sm" data-act="paidnow" data-id="'+x.d.id+'" data-m="'+x.m+'">Marcar pago</button></div></div>';
  }).join("")+'</div></div>';
}
function vReserva(){
  var nowM=ym(new Date()),vals=[],basis="";
  for(var i=1;i<=3;i++){var sp=stats(addM(nowM,-i)).spend;if(sp>0)vals.push(sp);}
  if(vals.length)basis="média dos últimos "+vals.length+(vals.length===1?" mês fechado":" meses fechados");
  else{var cs=stats(nowM).spend;if(cs>0){vals.push(cs);basis="gastos deste mês até agora";}}
  var avg=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:0,months=S.reserveMonths||6,goal=avg*months;
  var pot=S.pots.filter(function(x){return x.id===S.reservePot;})[0],have=pot?potBal(pot):totalSaved();
  var h='<div class="card" style="margin-top:14px"><h2>Reserva de emergência</h2>'+
    '<form data-form="reserve" class="row"><div class="field" style="flex:0 1 150px"><label for="rsm">Meses de gastos</label><input id="rsm" name="months" type="number" min="1" max="24" value="'+months+'"></div>'+
    '<div class="field"><label for="rsp">O que conta como reserva</label><select id="rsp" name="pot"><option value="">Todos os cofrinhos</option>'+S.pots.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.reservePot?' selected':'')+'>'+esc(x.name)+'</option>';}).join("")+'</select></div>'+
    '<button class="btn sm" type="submit" style="align-self:flex-end">Salvar</button></form>';
  if(!avg)return h+'<div class="empty" style="margin-top:12px">Lance seus gastos de alguns meses para calcular quanto você precisa guardar.</div></div>';
  var pct=Math.min(100,have/goal*100),cover=have/avg;
  return h+'<div style="margin-top:12px"><div class="row between"><span class="sub">Gasto mensal considerado ('+basis+')</span><b class="num">'+brl(avg)+'</b></div>'+
    '<div class="row between" style="margin-top:6px"><span class="sub">Meta da reserva ('+months+' meses)</span><b class="num">'+brl(goal)+'</b></div>'+
    '<div class="bar" style="margin:10px 0 6px"><i style="width:'+pct+'%"></i></div>'+
    '<div class="row between"><span class="sub">'+brl(have)+' guardados · cobre '+cover.toFixed(1).replace(".",",")+' meses</span>'+
    (have>=goal?'<b class="pos num">Reserva completa!</b>':'<b class="num warn">Faltam '+brl(goal-have)+'</b>')+'</div></div></div>';
}
function applyRecurring(){
  var nowM=ym(new Date()),ch=false;
  S.recur.forEach(function(r){
    r.done=r.done||{};
    for(var m=r.start;m<=nowM;m=addM(m,1)){
      if(r.done[m])continue;
      var p=m.split("-"),dim=new Date(+p[0],+p[1],0).getDate(),dd=Math.min(r.day,dim);
      S.tx.push({id:uid(),type:r.type,desc:r.desc,v:r.v,cat:r.type==="in"?"Entrada":r.cat,d:m+"-"+String(dd).padStart(2,"0"),rid:r.id});
      r.done[m]=true;ch=true;
    }
  });
  return ch;
}
function vProj(st){
  var now=new Date(),nowM=ym(now),p=cur.split("-"),N=new Date(+p[0],+p[1],0).getDate();
  var c='<div class="card" style="margin-top:14px"><h2>Projeção do fim do mês</h2>';
  if(cur>nowM)return c+'<div class="sub">Este mês ainda não começou. A projeção aparece quando ele começar.</div></div>';
  if(cur<nowM)return c+'<div class="row between"><span>Mês encerrado</span><b class="num '+(st.saldo>=0?'pos':'neg')+'">Fechou em '+brl(st.saldo)+'</b></div></div>';
  var d=now.getDate(),perDay=st.exp/d,projVar=perDay*N,saldoProj=st.inc-projVar-st.fixed,resta=N-d,livre=st.inc-st.fixed-st.exp;
  var perm=resta>0?livre/resta:livre;
  c+='<div class="grid g4">'+
    '<div class="item" style="flex-direction:column;align-items:flex-start"><span class="s">Gasto médio por dia</span><b class="num">'+brl(perDay)+'</b></div>'+
    '<div class="item" style="flex-direction:column;align-items:flex-start"><span class="s">Gastos variáveis até o fim do mês</span><b class="num neg">'+brl(projVar)+'</b></div>'+
    '<div class="item" style="flex-direction:column;align-items:flex-start"><span class="s">Saldo projetado</span><b class="num '+(saldoProj>=0?'pos':'neg')+'">'+brl(saldoProj)+'</b></div>'+
    '<div class="item" style="flex-direction:column;align-items:flex-start"><span class="s">Pode gastar por dia (restam '+resta+')</span><b class="num '+(livre>0?'acc':'neg')+'">'+(livre>0?brl(perm):'Limite estourado')+'</b></div></div>';
  c+='<p class="sub" style="margin:10px 0 0">'+(st.inc===0?'Você ainda não lançou entradas neste mês, então o saldo projetado considera só os gastos. ':'')+
    (saldoProj>=0?'No ritmo atual, você termina o mês com sobra de '+brl(saldoProj)+'.':'No ritmo atual, você termina o mês no vermelho em '+brl(-saldoProj)+'.')+
    (d<5?' Há poucos dias de dados, então a projeção ainda é imprecisa.':'')+'</p></div>';
  return c;
}
function budgetStatus(k,st){
  var lim=S.budgets[k],spent=st.cats[k]||0,pct=lim>0?spent/lim*100:0;
  return{lim:lim,spent:spent,pct:pct,cls:pct>100?"o":(pct>=80?"w":"")};
}
function budgetAlerts(st){
  var al=Object.keys(S.budgets).map(function(k){return{k:k,b:budgetStatus(k,st)};}).filter(function(x){return x.b.pct>=80;});
  if(!al.length)return "";
  return '<div class="card" style="margin-top:14px"><h2>Alertas de orçamento</h2><div class="list">'+al.map(function(x){
    return '<div class="item"><div><div class="t">'+esc(x.k)+'</div><div class="s">'+brl(x.b.spent)+' de '+brl(x.b.lim)+'</div></div><b class="num '+(x.b.pct>100?'neg':'warn')+'">'+(x.b.pct>100?'Estourou em '+brl(x.b.spent-x.b.lim):'Perto do limite · restam '+brl(x.b.lim-x.b.spent))+'</b></div>';
  }).join("")+'</div></div>';
}
function vOrc(){
  var st=stats(cur),keys=Object.keys(S.budgets),totL=0,totS=0;
  var h=monthNav();
  h+='<div class="card"><h2>Definir limite por categoria</h2><form data-form="budget"><div class="row">'+
    '<div class="field"><label for="bc">Categoria</label><select id="bc" name="cat">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label for="bl">Limite mensal (R$)</label><input id="bl" name="v" inputmode="decimal" required placeholder="0,00"></div>'+
    '<button class="btn" type="submit" style="align-self:flex-end">Salvar limite</button></div></form>'+
    '<p class="sub" style="margin:8px 0 0">Definir de novo uma categoria substitui o limite anterior.</p></div>';
  h+='<div class="card" style="margin-top:14px"><h2>Limites de '+esc(monthName(cur))+'</h2>';
  if(!keys.length)return h+'<div class="empty">Nenhum limite definido. Escolha uma categoria acima, por exemplo Alimentação.</div></div>';
  h+='<div class="list">'+keys.map(function(k){
    var b=budgetStatus(k,st);totL+=b.lim;totS+=b.spent;
    var msg=b.pct>100?'Estourou em '+brl(b.spent-b.lim):(b.pct>=80?'Perto do limite · restam '+brl(b.lim-b.spent):'Dentro do limite · restam '+brl(b.lim-b.spent));
    return '<div class="item" style="flex-direction:column;align-items:stretch"><div class="row between"><div class="t">'+esc(k)+'</div><div class="row"><b class="num">'+brl(b.spent)+' / '+brl(b.lim)+'</b><button class="btn chrome sm" data-act="delbudget" data-id="'+esc(k)+'" aria-label="Remover limite">✕</button></div></div>'+
      '<div class="bar" style="margin-top:8px"><i class="'+b.cls+'" style="width:'+Math.min(100,b.pct)+'%"></i></div><div class="s" style="margin-top:6px">'+Math.round(b.pct)+'% · '+msg+'</div></div>';
  }).join("")+'</div>';
  h+='<div class="row between" style="margin-top:12px"><span class="sub">Total dos limites</span><b class="num">'+brl(totS)+' / '+brl(totL)+'</b></div></div>';
  return h;
}

      '<div class="row"><b class="num '+(r.type==="in"?"pos":"neg")+'">'+(r.type==="in"?"+ ":"− ")+brl(r.v)+'</b><button class="btn chrome sm" data-act="delrec" data-id="'+r.id+'" aria-label="Remover regra">✕</button></div></div>';
  }).join("")+'</div></div>';

function kpi(l,v,c){return '<div class="card kpi"><div class="lbl">'+l+'</div><div class="val '+c+'">'+v+'</div></div>';}

function vLanc(){

   '<div class="field"><label for="tt">Tipo</label><select id="tt" name="type"><option value="in">Entrada (+)</option><option value="out">Saída (−)</option></select></div>'+
   '<div class="field" style="flex:2 1 180px"><label for="td">Descrição</label><input id="td" name="desc" required placeholder="Ex.: mercado, salário"></div>'+

   '<div class="field"><label for="tdt">Data</label><input id="tdt" name="d" type="date" value="'+today()+'" required></div>'+

function vDividas(){
  var st=stats(cur);
  var h=monthNav();
  h+='<div class="grid g3">'+kpi("Total de dívidas fixas no mês",brl(st.fixed),"warn")+kpi("Já pago",brl(st.fixedPaid),"pos")+kpi("Falta pagar",brl(st.fixed-st.fixedPaid),"neg")+'</div>';
  h+='<div class="card" style="margin-top:14px"><h2>Nova dívida fixa</h2><form data-form="debt"><div class="row">'+
   '<div class="field" style="flex:2 1 180px"><label for="dn">Nome</label><input id="dn" name="name" required placeholder="Ex.: aluguel, internet, financiamento"></div>'+
   '<div class="field"><label for="dv">Valor mensal (R$)</label><input id="dv" name="v" inputmode="decimal" required placeholder="0,00"></div>'+
   '<div class="field"><label for="dd">Vence no dia</label><input id="dd" name="day" type="number" min="1" max="31" value="5"></div>'+
   '<div class="field"><label for="ds">Começa em</label><input id="ds" name="start" type="month" value="'+cur+'" required></div>'+
   '<div class="field"><label for="dp">Parcelas (opcional)</label><input id="dp" name="n" type="number" min="0" placeholder="Sem fim"></div>'+
   '<button class="btn" type="submit" style="align-self:flex-end">Adicionar</button></div></form></div>';
  var act=S.debts.filter(function(d){return debtActive(d,cur);});
  h+='<div class="card" style="margin-top:14px"><h2>Dívidas de '+esc(monthName(cur))+'</h2>';
  if(!act.length)h+='<div class="empty">Nenhuma dívida fixa neste mês.</div>';
  else h+='<div class="list">'+act.map(function(d){
    if(isEd("debt",d.id))return editDebt(d);
    var paid=d.paid&&d.paid[cur];
    var left=d.n?(' · parcela '+(monthsBetween(d.start,cur)+1)+' de '+d.n):'';

async function ask(q){

}

async function refreshRates(){
  toast("Buscando cotações…");
  try{
    var ctl=new AbortController();var t=setTimeout(function(){ctl.abort();},6000);
    var r=await fetch("https://open.er-api.com/v6/latest/BRL",{signal:ctl.signal});clearTimeout(t);
    var j=await r.json();
    if(!j||!j.rates)throw new Error("sem dados");
    CURS.forEach(function(c){if(j.rates[c[0]])S.rates[c[0]]=1/j.rates[c[0]];});
    S.rates.date=today();S.rates.approx=false;save();render();toast("Cotações atualizadas.");
  }catch(e){
    editRates=true;render();
    toast("Sem acesso à internet por aqui. Digite as cotações do dia abaixo.");
  }
}

document.addEventListener("click",function(ev){

  else if(a==="deldebt"){S.debts=S.debts.filter(function(x){return x.id!==id;});save();render();}

  else if(a==="canceledit"){editing=null;render();}
  else if(a==="paidnow"){S.debts.forEach(function(d){if(d.id===id){d.paid=d.paid||{};d.paid[t.dataset.m]=true;}});save();render();}

document.addEventListener("submit",function(ev){

  var k=f.dataset.form,fd=new FormData(f),g=function(n){return fd.get(n);};
  if(k==="tx"){
    var v=num(g("v"));if(v<=0)return toast("Digite um valor maior que zero.");
    S.tx.push({id:uid(),type:g("type"),desc:String(g("desc")).trim(),v:v,cat:g("type")==="in"?"Entrada":g("cat"),d:g("d")});
    if(g("d")&&g("d").slice(0,7)!==cur)cur=g("d").slice(0,7);
  }else if(k==="debt"){
    var dv=num(g("v"));if(dv<=0)return toast("Digite o valor mensal da dívida.");
    S.debts.push({id:uid(),name:String(g("name")).trim(),v:dv,day:Math.min(31,Math.max(1,parseInt(g("day"))||1)),start:g("start"),n:parseInt(g("n"))||0,paid:{}});
  }else if(k==="meta"){S.meta=num(g("meta"));toast("Meta de valor definida.");}
  else if(k==="rates"){
    CURS.forEach(function(c){var x=num(g(c[0]));if(x>0)S.rates[c[0]]=x;});
    S.rates.date=today();S.rates.approx=false;editRates=false;toast("Cotações salvas.");
  }else if(k==="pot"){
    var p={id:uid(),name:String(g("name")).trim(),hist:[]},iv=num(g("v"));
    if(iv>0)p.hist.push({d:today(),v:iv});S.pots.push(p);
  }else if(k==="move"||k==="gmove"){
    var amt=num(g("v")),sub=ev.submitter,dir=sub&&sub.value==="-1"?-1:1;
    if(amt<=0)return toast("Digite um valor maior que zero.");
    if(k==="move"){
      var pot=S.pots.filter(function(x){return x.id===f.dataset.id;})[0];
      if(dir<0&&amt>potBal(pot))return toast("Valor maior que o saldo deste cofrinho.");
      pot.hist.push({d:today(),v:dir*amt});

      var gl=S.goals.filter(function(x){return x.id===f.dataset.id;})[0];
      gl.saved=Math.max(0,gl.saved+dir*amt);
    }
  }else if(k==="goal"){
    var tg=num(g("target"));if(tg<=0)return toast("Digite o valor da meta.");
    S.goals.push({id:uid(),type:g("type"),name:String(g("name")).trim(),target:tg,saved:num(g("saved")),dl:g("dl")||""});
  }else if(k==="txedit"){
    var et=S.tx.filter(function(x){return x.id===f.dataset.id;})[0],ev2=num(g("v"));
    if(!et)return;if(ev2<=0)return toast("Digite um valor maior que zero.");
    et.type=g("type");et.desc=String(g("desc")).trim();et.v=ev2;et.cat=et.type==="in"?"Entrada":g("cat");et.d=g("d");
    if(et.d&&et.d.slice(0,7)!==cur)cur=et.d.slice(0,7);
    editing=null;toast("Lançamento atualizado.");
  }else if(k==="debtedit"){
    var ed=S.debts.filter(function(x){return x.id===f.dataset.id;})[0],edv=num(g("v"));
    if(!ed)return;if(edv<=0)return toast("Digite o valor mensal da dívida.");
    ed.name=String(g("name")).trim();ed.v=edv;ed.day=Math.min(31,Math.max(1,parseInt(g("day"))||1));ed.start=g("start");ed.n=parseInt(g("n"))||0;
    editing=null;toast("Dívida atualizada.");
  }else if(k==="goaledit"){
    var eg=S.goals.filter(function(x){return x.id===f.dataset.id;})[0],egt=num(g("target"));
    if(!eg)return;if(egt<=0)return toast("Digite o valor da meta.");
    eg.type=g("type");eg.name=String(g("name")).trim();eg.target=egt;eg.saved=num(g("saved"));eg.dl=g("dl")||"";
    editing=null;toast("Meta atualizada.");
  }else if(k==="reserve"){
    S.reserveMonths=Math.min(24,Math.max(1,parseInt(g("months"))||6));S.reservePot=g("pot")||"";
    toast("Reserva atualizada.");
  }else if(k==="budget"){
    var bl=num(g("v"));if(bl<=0)return toast("Digite o limite mensal.");
    S.budgets[g("cat")]=bl;toast("Limite salvo.");
  }else if(k==="recur"){
    var rv=num(g("v"));if(rv<=0)return toast("Digite o valor.");
    S.recur.push({id:uid(),type:g("type"),desc:String(g("desc")).trim(),v:rv,cat:g("cat"),day:Math.min(31,Math.max(1,parseInt(g("day"))||1)),start:g("start"),done:{}});
    applyRecurring();toast("Regra criada. Os lançamentos já aparecem em Lançamentos.");
  }else if(k==="ask"){
    var q=String(g("q")).trim();if(q){f.reset();ask(q);}return;
  }
  save();render();
});

/* ---------- calculadora flutuante ---------- */
var calcEl=$("#calc"),calcFab=$("#calcFab"),calcHead=$("#calcHead"),lastIn=null,calcDrag=null;
var CS={acc:null,op:null,cur:"0",fresh:true,pct:false,expr:""};
function cReset(){CS={acc:null,op:null,cur:"0",fresh:true,pct:false,expr:""};}
function cnum(){var n=parseFloat(String(CS.cur).replace(",","."));return isFinite(n)?n:0;}
function fRaw(n){if(!isFinite(n))return "Erro";var t=String(+n.toFixed(10));if(t.indexOf("e")>-1)t=n.toExponential(6);return t.replace(".",",");}
function fDisp(n){return isFinite(n)?n.toLocaleString("pt-BR",{maximumFractionDigits:10}):"Erro";}
function fShow(c){
  if(c==="Erro")return c;
  var neg=c.charAt(0)==="-",b=neg?c.slice(1):c,pr=b.split(","),ip=pr[0];
  var i=(ip.length>15||ip.indexOf("e")>-1)?ip:Number(ip).toLocaleString("pt-BR",{maximumFractionDigits:0});
  return (neg?"-":"")+i+(pr.length>1?","+pr[1]:"");
}
function cShow(){$("#calcExpr").textContent=CS.expr||"\u00a0";$("#calcCur").textContent=fShow(CS.cur);}
function cCompute(a,o,b){if(o==="+")return a+b;if(o==="−")return a-b;if(o==="×")return a*b;if(o==="÷")return b===0?NaN:a/b;return b;}
function cKey(k){
  if(CS.cur==="Erro"){
    if(k==="C"||k==="⌫"){cReset();cShow();return;}
    if(!/^[0-9,]$/.test(k))return;
    CS.cur="0";CS.fresh=true;CS.acc=null;CS.op=null;
  }
  if(/^[0-9]$/.test(k)){
    if(CS.fresh||CS.pct){CS.cur=k;CS.fresh=false;CS.pct=false;}
    else if(CS.cur.replace(/[-,]/g,"").length<14)CS.cur=CS.cur==="0"?k:(CS.cur==="-0"?"-"+k:CS.cur+k);
  }else if(k===","){
    if(CS.fresh||CS.pct){CS.cur="0,";CS.fresh=false;CS.pct=false;}
    else if(CS.cur.indexOf(",")<0)CS.cur+=",";
  }else if(k==="⌫"){
    if(!CS.fresh&&!CS.pct){CS.cur=CS.cur.slice(0,-1);if(CS.cur===""||CS.cur==="-")CS.cur="0";}
  }else if(k==="C"){cReset();
  }else if(k==="±"){
    if(CS.cur!=="0"&&CS.cur!=="0,")CS.cur=CS.cur.charAt(0)==="-"?CS.cur.slice(1):"-"+CS.cur;
  }else if(k==="%"){
    var pn=cnum();pn=(CS.op&&CS.acc!==null)?CS.acc*pn/100:pn/100;
    CS.cur=fRaw(pn);CS.fresh=false;CS.pct=true;
  }else if(k==="="){
    if(CS.op){
      var a=CS.acc,b=cnum(),r=cCompute(a,CS.op,b);
      CS.expr=fDisp(a)+" "+CS.op+" "+fDisp(b)+" =";CS.cur=fRaw(r);CS.acc=null;CS.op=null;CS.fresh=true;CS.pct=false;
    }
  }else{
    var n2=cnum();
    if(CS.op&&!CS.fresh){var r2=cCompute(CS.acc,CS.op,n2);CS.acc=r2;CS.cur=fRaw(r2);}
    else if(!CS.op){CS.acc=n2;}
    CS.op=k;CS.fresh=true;CS.pct=false;CS.expr=fDisp(CS.acc)+" "+k;
    if(!isFinite(CS.acc)){CS.cur="Erro";CS.acc=null;CS.op=null;CS.expr="";}
  }
  cShow();
}
function cUse(){
  var el=lastIn;
  if(!el||!document.contains(el)||el.disabled){toast("Toque antes em um campo de valor (R$) e depois em Usar no campo.");return;}
  if(CS.cur==="Erro")return;
  el.value=fRaw(Math.round(cnum()*100)/100);
  el.dispatchEvent(new Event("input",{bubbles:true}));
  el.focus();toast("Valor colocado no campo.");
}
function initCalc(){
  var L=[["C","c","Limpar"],["⌫","c","Apagar"],["%","c","Porcentagem"],["÷","o","Dividir"],["7","d"],["8","d"],["9","d"],["×","o","Multiplicar"],["4","d"],["5","d"],["6","d"],["−","o","Subtrair"],["1","d"],["2","d"],["3","d"],["+","o","Somar"],["±","c","Inverter sinal"],["0","d"],[",","d","Vírgula"],["=","o","Resultado"]];
  var cls={c:"btn chrome ck",o:"btn ck",d:"btn steel ck"};
  $("#calcKeys").innerHTML=L.map(function(x){return '<button class="'+cls[x[1]]+'" data-k="'+x[0]+'"'+(x[2]?' aria-label="'+x[2]+'"':'')+'>'+x[0]+'</button>';}).join("");
  $("#calcKeys").addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(b)cKey(b.dataset.k);});
  $("#calcUse").addEventListener("click",cUse);
  function toggle(open){calcEl.hidden=!open;calcFab.setAttribute("aria-expanded",String(open));}
  calcFab.addEventListener("click",function(){toggle(calcEl.hidden);});
  $("#calcClose").addEventListener("click",function(){toggle(false);});
  document.addEventListener("focusin",function(e){var t=e.target;if(t&&t.tagName==="INPUT"&&t.getAttribute("inputmode")==="decimal")lastIn=t;});
  document.addEventListener("keydown",function(e){
    if(calcEl.hidden)return;
    var tg=e.target;if(tg&&/^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName))return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==="Escape"){toggle(false);return;}
    var map={"*":"×","/":"÷","-":"−","Enter":"=","Backspace":"⌫",".":",","Delete":"C"},m=map[e.key]||e.key;
    if(/^[0-9]$/.test(m)||["+","−","×","÷","=","⌫",",","%","C"].indexOf(m)>-1){e.preventDefault();cKey(m);}
  });
  calcHead.addEventListener("pointerdown",function(e){
    if(e.target.closest("button"))return;
    var r=calcEl.getBoundingClientRect();
    calcDrag={dx:e.clientX-r.left,dy:e.clientY-r.top};
    calcEl.style.left=r.left+"px";calcEl.style.top=r.top+"px";calcEl.style.right="auto";calcEl.style.bottom="auto";
    try{calcHead.setPointerCapture(e.pointerId);}catch(x){}
  });
  calcHead.addEventListener("pointermove",function(e){
    if(!calcDrag)return;
    var x=Math.min(Math.max(0,e.clientX-calcDrag.dx),window.innerWidth-calcEl.offsetWidth);
    var y=Math.min(Math.max(0,e.clientY-calcDrag.dy),window.innerHeight-calcEl.offsetHeight);
    calcEl.style.left=x+"px";calcEl.style.top=y+"px";
  });
  calcHead.addEventListener("pointerup",function(){calcDrag=null;});
  calcHead.addEventListener("pointercancel",function(){calcDrag=null;});
  cShow();
}
initCalc();
load();if(applyRecurring())save();applyTheme();render();connectDb();connectSample();
})();
</script>
